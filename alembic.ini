[alembic]
script_location = migrations
prepend_sys_path = .

# No sqlalchemy.url here on purpose: migrations/env.py reads
# MEDINTELOS_DATABASE_URL at runtime so the same config works across
# development, CI, and every deployment without editing this file or
# committing a connection string.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
