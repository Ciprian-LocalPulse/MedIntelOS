name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medintelos
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: medintelos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medintelos -d medintelos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MEDINTELOS_DATABASE_URL: postgresql://medintelos:ci-only-password@localhost:5432/medintelos
      MEDINTELOS_TEST_DATABASE_URL: postgresql://medintelos:ci-only-password@localhost:5432/medintelos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/medintelos
      - run: alembic upgrade head
      - run: pytest

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run compile
      - run: npm test
